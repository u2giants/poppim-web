# Production release pipeline for poppim-web.
# Path (the ONLY normal release path — see docs/cicd.md):
#   push to main  ->  verify  ->  build+publish image to GHCR
#   ->  transport preflight (no secrets)  ->  trigger Coolify  ->  Coolify runs the image
# GitHub Actions never SSHes into the server or runs docker on it.
#
# Phase 0 transport gate (Jev activity-triage):
#   COOLIFY_TOKEN is loaded only after deploy-transport-preflight proves a
#   certificate-valid HTTPS hostname (or the later authorized private-tunnel
#   identity). Until that infrastructure handback sets
#   vars.COOLIFY_CONTROL_PLANE_URL, the deploy job is unreachable and the
#   former plaintext IP control-plane path stays deleted — never reintroduce it.
name: deploy

on:
  push:
    branches: [main]
    # Docs-only changes don't need a production build (§29). Keep this list narrow.
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.gitignore'
      - '.claudeignore'
      - '.cursorignore'
      - '.dockerignore'
      - 'LICENSE'

# Newer commit on the same branch cancels an in-flight run (§27).
concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: true

env:
  IMAGE: ghcr.io/u2giants/poppim-web
  # Coolify deployment platform (runtime owner). uuid is not a secret; token is.
  # COOLIFY_CONTROL_PLANE_URL must be an https:// hostname set by the authorized
  # infrastructure handback (repository variable). Empty/missing stays fail-closed.
  COOLIFY_CONTROL_PLANE_URL: ${{ vars.COOLIFY_CONTROL_PLANE_URL }}
  # Exact authorized control-plane hostname pin (post-handback transport pin).
  # A substituted repository variable cannot redirect the bearer token unless it
  # matches this reviewed constant. Never move this pin to a mutable variable.
  COOLIFY_CONTROL_PLANE_HOST_PIN: 'coolify.designflow.app'
  COOLIFY_APP_UUID: ysvdyj3t7d5tyh5ogrvlka4y

jobs:
  # 1) Verify — lint + strict typecheck/build gate. Must pass before publishing.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Coolify transport gate fixture
        run: bash scripts/test-deploy-transport.sh
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build # tsc -b && vite build — fails on type errors
        env:
          VITE_SUPABASE_URL: ${{ vars.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

  # 2) Publish — build the production image and push it to GHCR (immutable + mutable tags).
  publish:
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write # GITHUB_TOKEN may push to GHCR; no PAT needed
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Read commit metadata
        id: commit
        run: |
          commit_date="$(git show -s --format=%cI "$GITHUB_SHA")"
          echo "date=${commit_date}" >> "$GITHUB_OUTPUT"
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            VCS_REF=${{ github.sha }}
            COMMIT_DATE=${{ steps.commit.outputs.date }}
            BUILD_RUN=${{ github.run_id }}
            VITE_SUPABASE_URL=${{ vars.VITE_SUPABASE_URL }}
            VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}
          # sha-<commit> is the immutable audit/rollback tag; main is the convenience pointer (§6.2/§18).
          tags: |
            ${{ env.IMAGE }}:main
            ${{ env.IMAGE }}:sha-${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # 3) Transport preflight — NO secrets. Proves encrypted, server-authenticated
  #    control-plane transport before any job may load COOLIFY_TOKEN. Fails closed
  #    when vars.COOLIFY_CONTROL_PLANE_URL is unset (pre-handback) or insecure.
  deploy-transport-preflight:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Enforce Coolify transport gate fixture
        run: bash scripts/test-deploy-transport.sh
      - name: Validate secure Coolify control-plane transport (no secrets)
        env:
          CONTROL_PLANE_URL: ${{ vars.COOLIFY_CONTROL_PLANE_URL }}
          CONTROL_PLANE_HOST_PIN: ${{ env.COOLIFY_CONTROL_PLANE_HOST_PIN }}
        run: |
          set -euo pipefail
          url="${CONTROL_PLANE_URL:-}"
          host_pin="${CONTROL_PLANE_HOST_PIN:-}"
          if [ -z "$host_pin" ]; then
            echo "::error::Deploy blocked: COOLIFY_CONTROL_PLANE_HOST_PIN is empty. The authorized control-plane hostname is not pinned, so COOLIFY_TOKEN cannot be loaded or sent."
            exit 1
          fi
          if [ -z "$url" ]; then
            echo "::error::Deploy blocked: vars.COOLIFY_CONTROL_PLANE_URL is not configured. Deployment stays fail-closed until the authorized infrastructure handback provides a certificate-valid HTTPS hostname or authenticated encrypted private-tunnel identity."
            exit 1
          fi
          case "$url" in
            https://*) ;;
            *)
              echo "::error::Deploy blocked: control-plane URL must use the https scheme. Plaintext transport is forbidden."
              exit 1
              ;;
          esac
          rest="${url#https://}"
          authority="${rest%%/*}"
          host="${authority%%:*}"
          host="${host#[}"
          host="${host%]}"
          if [ -z "$host" ]; then
            echo "::error::Deploy blocked: control-plane URL has no hostname."
            exit 1
          fi
          if printf '%s' "$authority" | grep -q '@'; then
            echo "::error::Deploy blocked: control-plane URL must not embed userinfo credentials."
            exit 1
          fi
          if printf '%s' "$host" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "::error::Deploy blocked: control-plane URL must use a certificate-valid hostname, not a bare IPv4 address."
            exit 1
          fi
          if printf '%s' "$host" | grep -Eq '^[0-9a-fA-F:]+$' && printf '%s' "$host" | grep -q ':'; then
            echo "::error::Deploy blocked: control-plane URL must use a certificate-valid hostname, not a bare IPv6 address."
            exit 1
          fi
          if [ "$host" != "$host_pin" ]; then
            echo "::error::Deploy blocked: control-plane hostname does not match the authorized pin. COOLIFY_TOKEN was not loaded."
            exit 1
          fi
          if ! curl --silent --show-error --head \
            --connect-timeout 10 --max-time 20 \
            --proto '=https' --tlsv1.2 \
            --output /dev/null \
            "$url"; then
            echo "::error::Deploy blocked: secure transport preflight failed TLS/hostname/certificate validation. COOLIFY_TOKEN was not loaded."
            exit 1
          fi
          echo "Secure control-plane transport preflight passed. COOLIFY_TOKEN may load in the deploy job only."

  # 4) Deploy — trigger Coolify by API only after the no-secret transport preflight.
  #    poppim-web is a Coolify *service* (docker-compose), not an application, so we must
  #    update the service's docker_compose_raw to reference the immutable :sha-<commit> tag
  #    before restarting. The :main tag is cached locally by Docker and /restart would just
  #    restart the old container; a unique SHA tag is never cached, so Coolify's start
  #    (docker compose up -d) is forced to pull from GHCR.
  deploy:
    needs: [publish, deploy-transport-preflight]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Point Coolify service at the new SHA-tagged image and redeploy
        env:
          COOLIFY_TOKEN: ${{ secrets.COOLIFY_TOKEN }}
          CONTROL_PLANE_URL: ${{ vars.COOLIFY_CONTROL_PLANE_URL }}
          CONTROL_PLANE_HOST_PIN: ${{ env.COOLIFY_CONTROL_PLANE_HOST_PIN }}
          COOLIFY_APP_UUID: ${{ env.COOLIFY_APP_UUID }}
          IMAGE_TAG: ghcr.io/u2giants/poppim-web:sha-${{ github.sha }}
        run: |
          set -euo pipefail
          url="${CONTROL_PLANE_URL:-}"
          host_pin="${CONTROL_PLANE_HOST_PIN:-}"
          if [ -z "$host_pin" ]; then
            echo "::error::Deploy blocked: COOLIFY_CONTROL_PLANE_HOST_PIN is empty."
            exit 1
          fi
          case "$url" in
            https://*) ;;
            *)
              echo "::error::Deploy blocked: control-plane URL must use the https scheme."
              exit 1
              ;;
          esac
          rest="${url#https://}"
          authority="${rest%%/*}"
          host="${authority%%:*}"
          host="${host#[}"
          host="${host%]}"
          if [ -z "$host" ] || printf '%s' "$authority" | grep -q '@'; then
            echo "::error::Deploy blocked: control-plane URL failed hostname/userinfo checks."
            exit 1
          fi
          if printf '%s' "$host" | grep -Eq '^[0-9]{1,3}(\.[0-9]{1,3}){3}$'; then
            echo "::error::Deploy blocked: control-plane URL must use a certificate-valid hostname, not a bare IPv4 address."
            exit 1
          fi
          if printf '%s' "$host" | grep -Eq '^[0-9a-fA-F:]+$' && printf '%s' "$host" | grep -q ':'; then
            echo "::error::Deploy blocked: control-plane URL must use a certificate-valid hostname, not a bare IPv6 address."
            exit 1
          fi
          if [ "$host" != "$host_pin" ]; then
            echo "::error::Deploy blocked: control-plane hostname does not match the authorized pin."
            exit 1
          fi
          base="${url%/}"

          # Build the minimal docker-compose for the service (same shape as docker_compose_raw).
          DC_RAW=$(printf 'services:\n  poppim-web:\n    image: '"'"'%s'"'"'\n    environment:\n      SERVICE_FQDN_POPPIMWEB_80: pm-ci.designflow.app\n    expose:\n      - '"'"'80'"'"'\n    restart: unless-stopped\n' "$IMAGE_TAG")

          # Patch the service config to reference the new SHA-tagged image.
          # Coolify requires docker_compose_raw to be base64-encoded.
          # After patching, /restart does docker compose pull + up -d with the new config,
          # which fetches the SHA tag (never cached) from GHCR. This is simpler and more
          # reliable than stop+start, which has async-stop race conditions.
          DC_B64="$(printf '%s' "$DC_RAW" | base64 -w0)"
          curl --proto '=https' --tlsv1.2 --fail --silent --show-error -X PATCH \
            "${base}/api/v1/services/${COOLIFY_APP_UUID}" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}" \
            -H "Content-Type: application/json" \
            -d "{\"docker_compose_raw\": \"${DC_B64}\"}"

          curl --proto '=https' --tlsv1.2 --fail --silent --show-error -X POST \
            "${base}/api/v1/services/${COOLIFY_APP_UUID}/restart" \
            -H "Authorization: Bearer ${COOLIFY_TOKEN}"

      - name: Verify production is serving this commit
        env:
          EXPECTED_SHA: ${{ github.sha }}
          BASE_URL: https://pm.designflow.app
        run: |
          set -euo pipefail
          # index.html contains <meta name="build-sha" content="<sha>"> (baked by Vite).
          # Caddy always serves index.html for all routes, so we grep it directly.
          # Cache-busting query string prevents stale CDN/proxy responses.
          for attempt in {1..30}; do
            html="$(curl --proto '=https' --tlsv1.2 --fail --silent --show-error --max-time 10 "${BASE_URL}/?_v=${EXPECTED_SHA}-${attempt}" 2>/dev/null || true)"
            if printf '%s' "$html" | grep -Fq "${EXPECTED_SHA}"; then
              echo "Production is serving ${EXPECTED_SHA}."
              exit 0
            fi
            echo "Attempt ${attempt}/30: production has not updated to ${EXPECTED_SHA} yet."
            sleep 10
          done

          echo "::error::Coolify restart completed, but production did not serve ${EXPECTED_SHA} within 5 min."
          exit 1
